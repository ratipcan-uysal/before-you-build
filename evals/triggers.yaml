# Trigger and boundary tests.
#
# Each case is a prompt a user might actually type, and the skill that should
# fire for it. `expect: none` means no skill in this set should fire — those
# cases are the important ones. A set of skills with overlapping descriptions
# fails here first, long before a user notices it.
#
# Run with:  python3 scripts/validate.py     (structure only, free)
# Model-based routing checks are added once `claude plugin eval` is GA.

cases:
  # --- idea-grill: should fire -------------------------------------------
  - prompt: "We're thinking about adding a referral program. Poke holes in it."
    expect: idea-grill
  - prompt: "Should we build this? I want you to challenge my thinking, not agree with me."
    expect: idea-grill
  - prompt: "Talk me out of rewriting the billing service."
    expect: idea-grill
  - prompt: "Here's my strategy for Q3. What am I missing?"
    expect: idea-grill
  - prompt: "Bu fikri sorgula, kolay kabul etme."
    expect: idea-grill

  - prompt: "The business unit is asking for a loyalty tier. Does it hold up before I commit the team?"
    expect: idea-grill
    note: "proxy mode — someone else's request, output is questions for them"

  # --- idea-grill: should NOT fire (boundary) ----------------------------
  - prompt: "This feature is approved and starts next sprint. What could break in production?"
    expect: risk-interrogate
    note: "already decided — grilling the merits here wastes the user's time"
  - prompt: "Is this spec complete enough for the team to start building?"
    expect: readiness-score
    note: "measurement, not debate"
  - prompt: "Turn these notes into a proper written request."
    expect: request-shaper
    note: "production, not critique"
  - prompt: "Here's the checkout mockup. Tear it apart."
    expect: ux-grill
    note: "'tear it apart' is grill language, but the object is a finished screen"
  - prompt: "What screens do we need for this and what does each one do?"
    expect: design-brief
  - prompt: "Fix the failing test in auth_test.py"
    expect: none
  - prompt: "Summarise this article for me."
    expect: none

  # --- readiness-score: should fire -------------------------------------
  - prompt: "Here's the spec. Is this ready for the team to start building?"
    expect: readiness-score
  - prompt: "Score this ticket against a definition of ready."
    expect: readiness-score
  - prompt: "What's missing from this request before we can estimate it?"
    expect: readiness-score
  - prompt: "Bu analiz dokumani gelistirmeye hazir mi, kac puan verirsin?"
    expect: readiness-score

  # --- readiness-score: should NOT fire (boundary) -----------------------
  - prompt: "This spec is missing the error cases. Write them for me."
    expect: request-shaper
    note: "filling gaps is production, not measurement"
  - prompt: "Is this spec any good? I mean, is the idea behind it sound?"
    expect: idea-grill
    note: "merit of the idea, not completeness of the document"

  # --- request-shaper: should fire --------------------------------------
  - prompt: "Here are my notes from the call. Turn them into a proper request."
    expect: request-shaper
  - prompt: "This ticket is two lines. Help me flesh it out before I hand it over."
    expect: request-shaper
  - prompt: "Bu talebi analist-hazir bir dokumana cevir."
    expect: request-shaper

  # --- request-shaper: should NOT fire (boundary) ------------------------
  - prompt: "I already wrote the request. How complete is it?"
    expect: readiness-score
    note: "measuring an existing document, not producing one"
  - prompt: "Write the user stories and acceptance criteria in Jira format."
    expect: none
    note: "a formatting task, not a shaping one"

  # --- risk-interrogate: should fire ------------------------------------
  - prompt: "This is approved and starts next sprint. What could go wrong in production?"
    expect: risk-interrogate
  - prompt: "Run a risk pass over this spec before the team picks it up."
    expect: risk-interrogate
  - prompt: "We're shipping the new checkout next month. What am I not thinking about?"
    expect: risk-interrogate
  - prompt: "Bu canliya cikarsa ne patlar, riskleri cikar."
    expect: risk-interrogate

  # --- risk-interrogate: should NOT fire (boundary) ----------------------
  - prompt: "Is this feature even worth building? Convince me it isn't."
    expect: idea-grill
    note: "merit, not failure modes"
  - prompt: "Does this document cover the risks properly?"
    expect: readiness-score
    note: "measuring what the document contains, not generating risk questions"

  # --- design-brief: should fire ----------------------------------------
  - prompt: "What screens do we need for this and what should each one do?"
    expect: design-brief
  - prompt: "Write the design brief before we open Figma."
    expect: design-brief
  - prompt: "Turn this request into a prompt I can give v0 to generate the UI."
    expect: design-brief
  - prompt: "Ekranlarda hangi kararlari vermemiz gerekiyor?"
    expect: design-brief

  # --- design-brief: should NOT fire (boundary) --------------------------
  - prompt: "Here's the mockup we built. What's wrong with it?"
    expect: ux-grill
    note: "critique of an existing design"
  - prompt: "List every state this screen can be in, including the weird ones."
    expect: state-matrix
    note: "exhaustive sweep, not decisions"

  # --- ux-grill: should fire --------------------------------------------
  - prompt: "Here are the mockups. Tear them apart."
    expect: ux-grill
  - prompt: "Review this screen — what's wrong with it?"
    expect: ux-grill
  - prompt: "Bu ekran tasarimini elestir, kor noktalari bul."
    expect: ux-grill

  # --- ux-grill: should NOT fire (boundary) ------------------------------
  - prompt: "Nobody has decided what these screens should do yet. Work it out."
    expect: design-brief
    note: "deciding, not critiquing"
  - prompt: "Should we build this screen at all?"
    expect: idea-grill
    note: "merit of the idea, not quality of the design"

  # --- state-matrix: should fire ----------------------------------------
  - prompt: "List every state this screen needs, including the ones we forgot."
    expect: state-matrix
  - prompt: "What happens when the list is empty, or has ten thousand rows?"
    expect: state-matrix
  - prompt: "Did we cover all the edge cases for this surface?"
    expect: state-matrix
  - prompt: "Bu ekranin butun durumlarini cikar, unuttuklarimiz dahil."
    expect: state-matrix

  # --- state-matrix: should NOT fire (boundary) --------------------------
  - prompt: "Here's the finished screen. What's wrong with it?"
    expect: ux-grill
    note: "critique, not enumeration"
  - prompt: "We're shipping this next week. What breaks in production?"
    expect: risk-interrogate
    note: "failure modes of a system, not states of a surface"

  # --- flow-map: should fire --------------------------------------------
  - prompt: "Map the flow for this feature — every step, including the failures."
    expect: flow-map
  - prompt: "What happens step by step when someone does this?"
    expect: flow-map
  - prompt: "Turn this request into a user journey with the branches."
    expect: flow-map
  - prompt: "Bu talebin akisini cikar, hata yollari dahil."
    expect: flow-map

  # --- flow-map: should NOT fire (boundary) ------------------------------
  - prompt: "Here's our existing flow diagram. What's missing from it?"
    expect: flow-grill
    note: "auditing an existing flow, not producing one"
  - prompt: "What states can this one screen be in?"
    expect: state-matrix
    note: "states of a surface, not sequence across surfaces"

  # --- flow-grill: should fire ------------------------------------------
  - prompt: "Here's our flow diagram. What's missing from it?"
    expect: flow-grill
  - prompt: "Grill this user journey — did we cover all the paths?"
    expect: flow-grill
  - prompt: "Bu akisi denetle, eksik dallar var mi?"
    expect: flow-grill

  # --- flow-grill: should NOT fire (boundary) ----------------------------
  - prompt: "Nobody has written the flow yet. Work out what happens step by step."
    expect: flow-map
    note: "producing, not auditing"
  - prompt: "This flow is signed off. What could take it down in production?"
    expect: risk-interrogate
    note: "system behaviour in the world, not completeness of the document"

  # --- api-needs: should fire -------------------------------------------
  - prompt: "What does the frontend need from the backend for this flow?"
    expect: api-needs
  - prompt: "Work out what APIs we need before I talk to the backend team."
    expect: api-needs
  - prompt: "Can our services actually provide the data this design assumes?"
    expect: api-needs
  - prompt: "Bu akis icin backend'den ne istememiz gerekiyor?"
    expect: api-needs

  # --- api-needs: should NOT fire (boundary) -----------------------------
  - prompt: "Design the endpoints and write the OpenAPI spec."
    expect: none
    note: "designing the backend is not this set's job"
  - prompt: "The flow isn't written down yet — what are the steps?"
    expect: flow-map

  # --- impact-radar: should fire ----------------------------------------
  - prompt: "If I change this field, what breaks?"
    expect: impact-radar
  - prompt: "What's the blast radius of changing this endpoint?"
    expect: impact-radar
  - prompt: "Is it safe to change this business rule? What depends on it?"
    expect: impact-radar
  - prompt: "Bu kurali degistirirsem neyi bozarim?"
    expect: impact-radar

  # --- impact-radar: should NOT fire (boundary) --------------------------
  - prompt: "This new feature ships next sprint. What could go wrong in production?"
    expect: risk-interrogate
    note: "new work, not a change to something existing"
  - prompt: "Should we change this at all? Talk me out of it."
    expect: idea-grill

  # --- decision-memo: should fire ---------------------------------------
  - prompt: "Write the one-pager I take to leadership to get this approved."
    expect: decision-memo
  - prompt: "I need a memo that gets a yes on this by Friday."
    expect: decision-memo
  - prompt: "Bunu onaya goturecek tek sayfalik memo yaz."
    expect: decision-memo

  # --- decision-memo: should NOT fire (boundary) -------------------------
  - prompt: "Before I write anything, is this idea actually sound?"
    expect: idea-grill
  - prompt: "Write this up so the engineering team can start on it."
    expect: request-shaper
    note: "inward-facing request, not an outward-facing decision"
